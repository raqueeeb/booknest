# Test configuration. The suite runs against an in-memory database so it needs
# no production credentials and touches no real data. The values here are test
# fixtures, not secrets: they never reach a deployed environment.

spring.datasource.url=jdbc:h2:mem:booknest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# A throwaway signing key of the required length, used only by the tests.
app.jwt.secret=test-only-signing-key-not-used-anywhere-else-abcdefghij
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=https://booknestx.vercel.app,http://localhost:5173

# The seeder is exercised explicitly by its own tests, so leave it inert here.
ADMIN_USERNAME=
ADMIN_PASSWORD=

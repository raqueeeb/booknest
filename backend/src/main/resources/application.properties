spring.application.name=library-backend

# PostgreSQL Database (Render)
spring.datasource.url=jdbc:postgresql://REDACTED-DB-HOST/library_db_s7c6
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=REDACTED-DB-USERNAME
spring.datasource.password=REDACTED-DB-PASSWORD

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable H2 Console (not needed anymore)
spring.h2.console.enabled=false

# Server
server.port=8080

# JWT
# IMPORTANT: replace this with a long, random secret before deploying to production.
app.jwt.secret=REDACTED-JWT-SECRET
app.jwt.expiration-ms=86400000
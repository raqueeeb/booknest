spring.application.name=library-backend

# PostgreSQL Database (Render)

spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
# JPA / Hibernate

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable H2 Console (not needed anymore)

spring.h2.console.enabled=false

# Server

server.port=8080

# JWT
# No default: the application refuses to start without a secret rather than fall
# back to one committed here. It must be at least 32 characters (HS256).

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Browser origins allowed to call this API, comma separated and matched exactly.

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://booknestx.vercel.app,http://localhost:5173,http://localhost:3000}

# Logging

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
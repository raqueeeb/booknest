# Optional local MySQL profile. Activate with: --spring.profiles.active=mysql
# (requires a running MySQL server)
#
# Every value below comes from the environment and none has a default, so the
# application refuses to start rather than fall back to a credential committed
# here. Copy .env.example, fill it in locally, and never commit the result.

spring.datasource.url=${MYSQL_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
